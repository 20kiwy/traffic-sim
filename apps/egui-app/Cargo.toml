[package]
name = "egui-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "egui_app"
path = "src/lib.rs"
# cdylib: the wasm32 browser build (wasm-bindgen exports); rlib: native reuse
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "egui-app-bin"
path = "src/main.rs"

[dependencies]
web-time = "1"
egui = { workspace = true }
eframe = { workspace = true }
gdmath = { workspace = true }
gdscript = { workspace = true }
roads = { workspace = true }
roadkit = { workspace = true }
egui-kit = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }

# browser engine preview (wasm32): eframe WebRunner boot + panic console hook
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
